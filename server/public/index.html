<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Code — Wear Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+Hebrew:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141416;
    --border: #1e1e22;
    --border-bright: #2e2e36;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.08);
    --accent-mid: rgba(0,229,160,0.18);
    --text: #e8e8ec;
    --text-muted: #666670;
    --text-dim: #3a3a42;
    --danger: #ff4d6d;
    --mono: 'Space Mono', monospace;
    --sans: 'Noto Sans Hebrew', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-mark {
    width: 32px; height: 32px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 13px; color: var(--accent);
  }
  .logo-text { font-family: var(--mono); font-size: 13px; color: var(--text-muted); letter-spacing: 0.08em; }
  .logo-text span { color: var(--accent); }

  main { max-width: 860px; margin: 0 auto; padding: 40px 24px; }

  h1 { font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 32px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }
  .card-label {
    font-family: var(--mono); font-size: 10px; color: var(--text-muted);
    letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px;
  }
  .card-value { font-family: var(--mono); font-size: 28px; color: var(--accent); }

  .upload-zone {
    background: var(--surface);
    border: 1.5px dashed var(--border-bright);
    border-radius: 10px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    margin-bottom: 20px;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: var(--accent-dim); }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1.5px solid var(--border-bright);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    transition: border-color .2s;
  }
  .upload-zone:hover .upload-icon { border-color: var(--accent); }
  .upload-icon svg { width: 20px; height: 20px; stroke: var(--text-muted); transition: stroke .2s; }
  .upload-zone:hover .upload-icon svg { stroke: var(--accent); }
  .upload-title { font-size: 14px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
  .upload-sub { font-size: 12px; color: var(--text-muted); font-family: var(--mono); }

  .file-selected {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .file-selected.show { display: flex; }
  .file-name { font-family: var(--mono); font-size: 13px; color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-size { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }

  .btn {
    width: 100%; padding: 14px;
    background: var(--accent); color: #000;
    border: none; border-radius: 8px;
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em; cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface); border: 1px solid var(--border-bright);
    border-radius: 8px; padding: 12px 20px;
    font-family: var(--mono); font-size: 12px;
    transition: transform .3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 100; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--accent); color: var(--accent); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  .apps-section { margin-top: 40px; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
    font-family: var(--mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase;
  }
  .refresh-btn {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    transition: color .15s;
  }
  .refresh-btn:hover { color: var(--accent); }

  .app-list { display: flex; flex-direction: column; gap: 8px; }
  .app-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 18px;
    display: flex; align-items: center; gap: 16px;
    transition: border-color .15s;
  }
  .app-item:hover { border-color: var(--border-bright); }
  .app-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .app-name { font-family: var(--mono); font-size: 13px; color: var(--text); flex: 1; }
  .app-meta { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .app-delete {
    background: none; border: 1px solid transparent; border-radius: 4px;
    color: var(--text-dim); cursor: pointer; padding: 4px 8px;
    font-family: var(--mono); font-size: 10px; transition: all .15s;
  }
  .app-delete:hover { color: var(--danger); border-color: var(--danger); }

  .empty { text-align: center; padding: 40px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--border-bright); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo-mark">MC</div>
  <div class="logo-text"><span>Master Code</span> / wear-store</div>
</header>

<main>
  <h1>// deploy panel</h1>

  <div class="grid">
    <div class="card">
      <div class="card-label">אפליקציות</div>
      <div class="card-value" id="stat-count">—</div>
    </div>
    <div class="card">
      <div class="card-label">storage</div>
      <div class="card-value" id="stat-size">—</div>
    </div>
  </div>

  <div class="upload-zone" id="drop-zone">
    <input type="file" id="file-input" accept=".apk">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
      </svg>
    </div>
    <div class="upload-title">גרור APK לכאן</div>
    <div class="upload-sub">או לחץ לבחירה</div>
  </div>

  <div class="file-selected" id="file-preview">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink:0;color:#00e5a0">
      <rect x="2" y="1" width="9" height="13" rx="1.5"/><path d="M11 1l3 3v10a1 1 0 01-1 1H5"/>
    </svg>
    <span class="file-name" id="file-name-display"></span>
    <span class="file-size" id="file-size-display"></span>
  </div>

  <button class="btn" id="upload-btn" disabled onclick="uploadFile()">העלה לשרת</button>

  <div class="apps-section">
    <div class="section-header">
      <span>// installed apps</span>
      <button class="refresh-btn" onclick="loadApps()">↻ רענן</button>
    </div>
    <div class="app-list" id="app-list"><div class="empty"><div class="spinner"></div></div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
let selectedFile = null;

const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
const uploadBtn = document.getElementById('upload-btn');
const filePreview = document.getElementById('file-preview');
const fileNameDisplay = document.getElementById('file-name-display');
const fileSizeDisplay = document.getElementById('file-size-display');

fileInput.addEventListener('change', e => setFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.name.endsWith('.apk')) setFile(f);
  else showToast('קובץ חייב להיות APK', 'error');
});

function setFile(f) {
  if (!f) return;
  selectedFile = f;
  fileNameDisplay.textContent = f.name;
  fileSizeDisplay.textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  filePreview.classList.add('show');
  uploadBtn.disabled = false;
}

async function uploadFile() {
  if (!selectedFile) return;
  uploadBtn.disabled = true;
  uploadBtn.textContent = 'מעלה...';
  const fd = new FormData();
  fd.append('apk', selectedFile);
  try {
    const r = await fetch('/upload', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.success) {
      showToast('✓ ' + d.filename + ' הועלה בהצלחה', 'success');
      selectedFile = null;
      filePreview.classList.remove('show');
      fileInput.value = '';
      loadApps();
    } else {
      showToast(d.error || 'שגיאה בהעלאה', 'error');
    }
  } catch { showToast('שגיאת רשת', 'error'); }
  uploadBtn.disabled = false;
  uploadBtn.textContent = 'העלה לשרת';
}

async function loadApps() {
  const list = document.getElementById('app-list');
  list.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  try {
    const r = await fetch('/apps');
    const apps = await r.json();
    document.getElementById('stat-count').textContent = apps.length;
    const totalMB = apps.reduce((s, a) => s + parseFloat(a.size), 0);
    document.getElementById('stat-size').textContent = totalMB.toFixed(1) + ' MB';
    if (!apps.length) {
      list.innerHTML = '<div class="empty">אין אפליקציות עדיין</div>';
      return;
    }
    list.innerHTML = apps.map(a => `
      <div class="app-item">
        <div class="app-dot"></div>
        <div class="app-name">${a.filename}</div>
        <div class="app-meta">${a.size}</div>
        <button class="app-delete" onclick="deleteApp('${a.filename}')">מחק</button>
      </div>`).join('');
  } catch { list.innerHTML = '<div class="empty">שגיאה בטעינה</div>'; }
}

async function deleteApp(filename) {
  if (!confirm('למחוק את ' + filename + '?')) return;
  try {
    const r = await fetch('/apps/' + filename, { method: 'DELETE' });
    const d = await r.json();
    if (d.success) { showToast('נמחק', 'success'); loadApps(); }
  } catch { showToast('שגיאה', 'error'); }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadApps();
</script>
</body>
</html>
